<p-toolbar [style]="{ 'border-radius': '3rem' }">
    <ng-template #start [style]="{ 'background-color':'red'}">
        <img src="./icon.png" alt="" width="22">
        <div class="flex items-center gap-3">
            <p-button routerLink="home" label="Home" text plain />
            <p-button routerLink="category" label="Categories" text plain />
            <p-button routerLink="search" label="Search" text plain />
        </div>
    </ng-template>

    <ng-template #end>
        <p-iconfield style="margin-right: 30px;">
            <p-inputicon class="pi pi-search" />
            <input type="text" pInputText placeholder="Search" style="width: 100%; padding: 0.75rem 0.75rem 0.75rem 2.5rem; height: 40px; border-radius: 3rem;" />
        </p-iconfield>
    </ng-template>
</p-toolbar>
